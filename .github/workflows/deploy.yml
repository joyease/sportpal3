name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 確保這與您的 GitHub 分支名稱一致 (如果是 master 請改為 master)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 預設的編譯輸出資料夾
          branch: gh-pages # 部署到的目標分支
