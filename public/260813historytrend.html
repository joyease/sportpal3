<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度運動趨勢 - SportPal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .chart-container { position: relative; height: 320px; width: 100%; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
            <div>
                <div class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-widest rounded-full mb-3">Statistics Dashboard 2026</div>
                <h1 class="text-4xl font-black text-gray-900 tracking-tight">年度運動趨勢</h1>
                <p class="text-gray-500 mt-2 font-medium">完整 1 ~ 12 月運動表現數據分析</p>
            </div>
            <div class="flex items-center gap-4 bg-white/50 p-2 rounded-2xl border border-gray-100">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-white rounded-xl shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
                    <span class="text-xs font-bold text-gray-700">距離 (km)</span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-white rounded-xl shadow-sm">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                    <span class="text-xs font-bold text-gray-700">時間 (min)</span>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-32 bg-white rounded-[40px] border border-dashed border-gray-200">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-400 font-bold tracking-[0.2em] uppercase text-[10px]">正在載入 2026 年度數據...</p>
        </div>

        <!-- Dashboard Content -->
        <div id="dashboard" class="hidden">
            <!-- Stats Summary -->
            <div id="statsSummary" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <!-- JS Inject -->
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Distance Chart -->
                <div class="bg-white p-8 rounded-[40px] shadow-sm border border-gray-100">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-[0.2em] mb-8">每月運動距離 (km)</h3>
                    <div class="chart-container">
                        <canvas id="distanceChart"></canvas>
                    </div>
                </div>

                <!-- Duration Chart -->
                <div class="bg-white p-8 rounded-[40px] shadow-sm border border-gray-100">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-[0.2em] mb-8">每月運動時間 (min)</h3>
                    <div class="chart-container">
                        <canvas id="durationChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            authDomain: "sportpal-4a832.firebaseapp.com",
            projectId: "sportpal-4a832",
            storageBucket: "sportpal-4a832.appspot.com",
            messagingSenderId: "81251874995",
            appId: "1:81251874995:web:757367468160c878931168"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const q = query(
                        collection(db, "sport_records"),
                        where("userId", "==", user.uid),
                        orderBy("timestamp", "asc")
                    );
                    const querySnapshot = await getDocs(q);
                    const records = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.timestamp && data.timestamp.toDate) data.dateObj = data.timestamp.toDate();
                        else if (data.timestamp) data.dateObj = new Date(data.timestamp);
                        else if (data.date) data.dateObj = new Date(data.date);
                        records.push(data);
                    });
                    
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    processAndRender(records);
                } catch (err) {
                    console.error("Fetch error:", err);
                    document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">數據載入失敗</p>';
                }
            } else {
                document.getElementById('loading').innerHTML = '<p class="text-gray-400 font-bold">請先登入 SportPal</p>';
            }
        });

        function processAndRender(records) {
            const currentYear = 2026; 
            const months = Array.from({length: 12}, (_, i) => ({
                label: (i + 1) + "月",
                distance: 0,
                duration: 0,
                count: 0
            }));

            let totalDist = 0, totalDur = 0, totalCount = 0;

            records.forEach(rec => {
                const recDate = rec.dateObj;
                if (!recDate || isNaN(recDate.getTime())) return;

                if (recDate.getFullYear() === currentYear) {
                    const mIdx = recDate.getMonth();
                    const dist = parseFloat(rec.distance) || 0;
                    const dur = parseFloat(rec.duration) || 0;

                    months[mIdx].distance += dist;
                    months[mIdx].duration += dur;
                    months[mIdx].count += 1;
                    
                    totalDist += dist;
                    totalDur += dur;
                    totalCount += 1;
                }
            });

            // 更新統計卡片
            const hours = (totalDur / 60).toFixed(1);
            document.getElementById('statsSummary').innerHTML = `
                <div class="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm stat-card">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">年度累積里程</div>
                    <div class="text-3xl font-black text-blue-600">${totalDist.toFixed(1)} <span class="text-xs font-medium text-gray-400">km</span></div>
                </div>
                <div class="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm stat-card">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">年度總運動時間</div>
                    <div class="text-3xl font-black text-emerald-600">${hours} <span class="text-xs font-medium text-gray-400">hrs</span></div>
                </div>
                <div class="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm stat-card">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">年度運動次數</div>
                    <div class="text-3xl font-black text-purple-600">${totalCount} <span class="text-xs font-medium text-gray-400">次</span></div>
                </div>
                <div class="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm stat-card">
                    <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">月均運動里程</div>
                    <div class="text-3xl font-black text-orange-500">${(totalDist / 12).toFixed(1)} <span class="text-xs font-medium text-gray-400">km</span></div>
                </div>
            `;

            renderCharts(months);
        }

        function renderCharts(months) {
            const labels = months.map(m => m.label);
            const distData = months.map(m => m.distance);
            const durData = months.map(m => m.duration);

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#64748b' } }
                }
            };

            new Chart(document.getElementById('distanceChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '距離 (km)',
                        data: distData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4
                    }]
                },
                options: commonOptions
            });

            new Chart(document.getElementById('durationChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '時間 (min)',
                        data: durData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4
                    }]
                },
                options: commonOptions
            });
        }
    </script>
</body>
</html>
